services:
  - type: web
    name: marine-verification
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: PORT
        value: "3000"
      - key: DATABASE_SSL
        value: "true"
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_VERIFIED_ROLE_ID
        sync: false
      - key: DISCORD_LOG_CHANNEL_ID
        sync: false
      - key: DISCORD_ADMIN_ROLE_ID
        sync: false
      - key: DISCORD_OWNER_ID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ROBLOX_API_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ROLE_HQMC
        sync: false
      - key: ROLE_TECOM
        sync: false
      - key: ROLE_MCRD
        sync: false
      - key: ROLE_I_MEF
        sync: false
      - key: ROLE_MARSOC
        sync: false
      - key: TEAM_HQMC
        value: Headquarters Marine Corps
      - key: TEAM_TECOM
        value: Training and Education Command
      - key: TEAM_MCRD
        value: Marine Corps Recruit Depot
      - key: TEAM_I_MEF
        value: I Marine Expeditionary Force
      - key: TEAM_MARSOC
        value: Marine Forces Special Operations Command
      - key: TEAM_DEFAULT
        value: Civilian
      - key: TEAM_PERSONNEL
        value: Marine Corps Personnel
